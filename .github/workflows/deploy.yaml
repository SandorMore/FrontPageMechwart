#név
name: Deploy

#mikor hova
on: 
  push:
    branches: [main]

#miket csináljon
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      
      - run: npm ci
      - run: npm run build

      - uses: SamKirkland/FPT-Deploy-Action@v4.3.5
      - with:
          server: ${{ secrets.FTP_SERVER }}
          usename: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: /